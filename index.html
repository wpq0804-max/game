<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冒險者猜拳遊戲 - 5勝制終極大對決</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-card {
            background: #252538;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 600px;
            padding: 24px;
            border: 1px solid #3d3d5c;
        }

        h1 {
            text-align: center;
            color: #ffd700;
            margin-bottom: 20px;
            font-size: 1.8rem;
        }

        .section {
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 16px;
            border-radius: 8px;
            border: 1px solid #4a4a6a;
            background: #1a1a28;
            color: #fff;
            font-size: 1rem;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #6c5ce7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #5b4bc4;
        }

        button:disabled {
            background: #44445a;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            background: #1a1a28;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
        }

        .score-box h3 {
            font-size: 0.9rem;
            color: #a0a0c0;
        }

        .score-box p {
            font-size: 2rem;
            font-weight: bold;
            color: #00cec9;
        }

        .item-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .item-btn {
            flex: 1;
            padding: 10px;
            background: #fdcb6e;
            color: #2d3436;
            font-size: 0.9rem;
        }

        .item-btn:hover {
            background: #e1b12c;
        }

        .hand-group {
            display: flex;
            gap: 10px;
        }

        .hand-btn {
            flex: 1;
            padding: 15px;
            font-size: 1.2rem;
            background: #0984e3;
        }

        .hand-btn:hover {
            background: #0769b5;
        }

        .log-box {
            background: #151520;
            border-radius: 8px;
            padding: 15px;
            height: 180px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.95rem;
            line-height: 1.5;
            border: 1px solid #33334d;
        }

        .log-entry {
            margin-bottom: 6px;
        }

        .log-entry.system { color: #ffeaa7; }
        .log-entry.win { color: #55efc4; }
        .log-entry.lose { color: #ff7675; }
        .log-entry.item { color: #a29bfe; }
    </style>
</head>
<body>

<div class="game-card">
    <h1>✊✋✌️ 冒險者猜拳終極大對決</h1>

    <!-- 登入階段 -->
    <div id="login-stage" class="section">
        <label>冒險者名字：</label>
        <input type="text" id="player-name" placeholder="例如：亞瑟" value="勇敢冒險者">
        
        <label>使用裝備：</label>
        <input type="text" id="player-equip" placeholder="例如：黃金鍵盤" value="黃金鍵盤">
        
        <button onclick="startGame()">開始冒險 (5 勝制)</button>
    </div>

    <!-- 遊戲主體階段 -->
    <div id="game-stage" class="section" style="display: none;">
        <div class="score-board">
            <div class="score-box">
                <h3 id="display-player-name">玩家</h3>
                <p id="player-score">0</p>
            </div>
            <div class="score-box">
                <h3>回合</h3>
                <p id="round-count">1</p>
            </div>
            <div class="score-box">
                <h3>電腦</h3>
                <p id="comp-score">0</p>
            </div>
        </div>

        <div class="section">
            <p style="margin-bottom: 8px; color: #a0a0c0;">🎒 可用道具（單場限用一次）：</p>
            <div class="item-group">
                <button class="item-btn" id="btn-double" onclick="useItem('雙倍勝場')">✨ 雙倍勝場</button>
                <button class="item-btn" id="btn-shield" onclick="useItem('護盾')">🛡️ 護盾</button>
                <button class="item-btn" id="btn-peek" onclick="useItem('偷看')">🔮 偷看</button>
            </div>
        </div>

        <div class="section">
            <p style="margin-bottom: 8px; color: #a0a0c0;">請出拳：</p>
            <div class="hand-group">
                <button class="hand-btn" onclick="playRound('剪刀')">✌️ 剪刀</button>
                <button class="hand-btn" onclick="playRound('石頭')">✊ 石頭</button>
                <button class="hand-btn" onclick="playRound('布')">✋ 布</button>
            </div>
        </div>

        <div class="log-box" id="log-box"></div>

        <button id="restart-btn" style="display: none; margin-top: 15px; background: #00b894;" onclick="resetGame()">🎮 再挑戰一次</button>
    </div>
</div>

<script>
    let name = '';
    let equipment = '';
    let playerWins = 0;
    let computerWins = 0;
    let roundNum = 1;
    let items = { '雙倍勝場': true, '護盾': true, '偷看': true };

    let doubleActive = false;
    let shieldActive = false;
    let nextCompChoice = '';

    const options = ["剪刀", "石頭", "布"];

    function log(msg, type = '') {
        const logBox = document.getElementById('log-box');
        const div = document.createElement('div');
        div.className = `log-entry ${type}`;
        div.textContent = msg;
        logBox.appendChild(div);
        logBox.scrollTop = logBox.scrollHeight;
    }

    function startGame() {
        name = document.getElementById('player-name').value.trim() || '冒險者';
        equipment = document.getElementById('player-equip').value.trim() || '新手裝備';

        document.getElementById('login-stage').style.display = 'none';
        document.getElementById('game-stage').style.display = 'block';
        document.getElementById('display-player-name').textContent = name;

        log(`=== 系統廣播 ===`, 'system');
        log(`歡迎勇敢的冒險者【${name}】！`, 'system');
        log(`你已經裝備了【${equipment}】，準備好迎接第一關的 【猜拳】 挑戰！`, 'system');
        log(`規則：先獲得 5 勝的一方就是最終贏家！`, 'system');

        prepareRound();
    }

    function prepareRound() {
        doubleActive = false;
        shieldActive = false;
        nextCompChoice = options[Math.floor(Math.random() * options.length)];
    }

    function useItem(itemName) {
        if (!items[itemName]) return;

        items[itemName] = false;
        if (itemName === '雙倍勝場') {
            document.getElementById('btn-double').disabled = true;
            doubleActive = true;
            log(`✨ 已發動【雙倍勝場】！本回合若獲勝將直接獲得 2 分！`, 'item');
        } else if (itemName === '護盾') {
            document.getElementById('btn-shield').disabled = true;
            shieldActive = true;
            log(`🛡️ 已發動【護盾】！本回合若輸了電腦無法得分！`, 'item');
        } else if (itemName === '偷看') {
            document.getElementById('btn-peek').disabled = true;
            log(`🔮 發動【偷看】！預知水晶球顯示電腦這回合會出：【${nextCompChoice}】`, 'item');
        }
    }

    function playRound(playerChoice) {
        if (playerWins >= 5 || computerWins >= 5) return;

        const compChoice = nextCompChoice;
        log(`--- 第 ${roundNum} 回合 ---`);
        log(`你出了【${playerChoice}】，🤖 電腦出了【${compChoice}】`);

        if (playerChoice === compChoice) {
            log(`🤝 平手！沒有人得分。`);
        } else if (
            (playerChoice === "剪刀" && compChoice === "布") ||
            (playerChoice === "石頭" && compChoice === "剪刀") ||
            (playerChoice === "布" && compChoice === "石頭")
        ) {
            const gain = doubleActive ? 2 : 1;
            playerWins += gain;
            log(`🎉 這回合你贏了！獲得 ${gain} 分！`, 'win');
        } else {
            if (shieldActive) {
                log(`🛡️ 這回合你輸了，但【護盾】生效！電腦無法得分！`, 'item');
            } else {
                log(`💥 這回合電腦贏了！`, 'lose');
                computerWins++;
            }
        }

        document.getElementById('player-score').textContent = playerWins;
        document.getElementById('comp-score').textContent = computerWins;

        if (playerWins >= 5 || computerWins >= 5) {
            endGame();
        } else {
            roundNum++;
            document.getElementById('round-count').textContent = roundNum;
            prepareRound();
        }
    }

    function endGame() {
        log(`=== 🌟 最終結果 🌟 ===`, 'system');
        if (playerWins >= 5) {
            log(`🏆 恭喜你以 ${playerWins} : ${computerWins} 擊敗了電腦，成為剪刀石頭布大師！`, 'win');
        } else {
            log(`💻 很可惜，電腦以 ${computerWins} : ${playerWins} 獲得了最終勝利，下次再來挑戰吧！`, 'lose');
        }

        const handBtns = document.querySelectorAll('.hand-btn, .item-btn');
        handBtns.forEach(btn => btn.disabled = true);
        document.getElementById('restart-btn').style.display = 'block';
    }

    function resetGame() {
        playerWins = 0;
        computerWins = 0;
        roundNum = 1;
        items = { '雙倍勝場': true, '護盾': true, '偷看': true };

        document.getElementById('player-score').textContent = 0;
        document.getElementById('comp-score').textContent = 0;
        document.getElementById('round-count').textContent = 1;
        document.getElementById('log-box').innerHTML = '';

        const itemBtns = document.querySelectorAll('.item-btn');
        itemBtns.forEach(btn => btn.disabled = false);

        const handBtns = document.querySelectorAll('.hand-btn');
        handBtns.forEach(btn => btn.disabled = false);

        document.getElementById('restart-btn').style.display = 'none';

        log(`=== 系統廣播 ===`, 'system');
        log(`新的一輪開始！冒險者【${name}】加油！`, 'system');
        prepareRound();
    }
</script>

</body>
</html>
